# SOC 数字员工 CI 守门（sdd-flow 阶段 6 产物；仓库根是父仓，实际工程在 soc-demo/ 子目录）
# 最小门禁：spec gate + lint + 类型检查 + 测试 + compose 配置校验。不绿不合并。
name: ci

on:
  push:
    branches: [main]
    paths: ["soc-demo/**", "tools/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["soc-demo/**", "tools/**", ".github/workflows/ci.yml"]

jobs:
  spec-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: soc-demo
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check_specs.py
      # lockfile integrity 体检闸（2026-09-17 a57ac26 事故闸）：脱敏扫描误伤 lockfile 哈希，
      # ssri 解不出 digest，被 Docker 层缓存掩盖多日才在安装层炸出误导性 TARBALL_EXTRACT。
      # 本闸在一切安装之前几十秒点名；--self-test 证明侦测能力活着（好夹具绿/三类坏夹具红）。
      - run: python3 ../tools/check_lockfiles.py --self-test
      - run: python3 ../tools/check_lockfiles.py

  ts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: soc-demo
    steps:
      - uses: actions/checkout@v4
      # 票 27（agent-guard 狗粮首用）：soc-demo services/agent 以 link: 协议依赖兄弟仓
      # agentjiaotu 的 packages/agent-guard（link:../../../agentjiaotu/...，lockfile 在案）。
      # link: 目标是构建期真实文件系统路径——必须先把它 checkout 到与本仓平级的
      # agentjiaotu/（复刻本地「安全评估agent/soc-demo 与 agentjiaotu 兄弟目录」布局），
      # 且在 pnpm install 之前：缺了这步 install 照样过（pnpm 对 link: 建的悬空 symlink
      # 不报错），要等 vitest 加载 @agentjiaotu/agent-guard 才炸，报错误导排障。
      # 注：agentjiaotu 仓在父仓 .gitignore 里（独立仓），父仓 checkout 拿不到它，必须单独克隆。
      - uses: actions/checkout@v4
        with:
          repository: zzwcoding/agentjiaotu # origin 与父仓同 org；仓尚未在 GitHub 落位前此步会红——落位即愈
          path: agentjiaotu # 默认即此，写明 = link: 相对路径的可视锚点
      - uses: pnpm/action-setup@v4 # 版本读 soc-demo/package.json 的 packageManager 字段——父仓根无 package.json，须显式指路（否则 "No pnpm version is specified"）
        with:
          package_json_file: soc-demo/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: soc-demo/pnpm-lock.yaml
      # 票 28 边界闸：specs「边界规则」节的机器消费（零依赖 python，无需装包）
      - run: pnpm check:boundary
      # 票 80 零增量闸（T20）：内容层票 diff 与机制层目录交集为空。CI 浅克隆拿不到
      # origin/main 时回退 HEAD=工作树档（恒绿，闸机制由 --self-test 证明活着）；
      # PR diff 档（--base merge-base）在本地收口与 L0 关票时强制执行。
      - run: pnpm check:zero-increment
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: soc-demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r services/guards/requirements.txt -r services/guards/requirements-dev.txt -r services/gateway/requirements.txt -r services/gateway/requirements-dev.txt
      - run: ruff check services/guards services/gateway
      # 各服务目录内独立跑 pytest：prepend 模式会把服务目录加进 sys.path，app 模块直接可 import
      - run: python -m pytest
        working-directory: soc-demo/services/guards
      - run: python -m pytest
        working-directory: soc-demo/services/gateway

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f soc-demo/docker-compose.yml config -q
