# SOC 数字员工 · 单机编排（PRD §4.1 组件清单 C1-C7；eval/MCP CLI 不进 compose）
# 端口规划：ingest 3001 / case-backend 3002 / agent 3003 / web 5173 / guards 8001 / gateway 8002 / chroma 8000 / contextforge 4444 / openfga 18080(宿主) / langfuse 13000(宿主，可选)
# 健康检查一律用 127.0.0.1 不用 localhost：alpine 镜像里 localhost 优先解析 ::1，服务只绑 IPv4 会被误判挂掉
services:
  ingest:
    build: { context: ., dockerfile: services/ingest/Dockerfile }
    ports: ["3001:3001"]
    # 缺它 m2client 回退 127.0.0.1:3002——容器里指 ingest 自己，webhook 必 500
    environment:
      CASE_BACKEND_URL: http://case-backend:3002
    depends_on:
      case-backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12

  case-backend:
    build: { context: ., dockerfile: services/case-backend/Dockerfile }
    ports: ["3002:3002"]
    # 库文件解析到 /app/data（index.ts 的 ../../../data/），必须挂这里；挂别处=每次重建丢数据
    volumes: ["./data/case-backend:/app/data"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3002/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12

  agent:
    build: { context: ., dockerfile: services/agent/Dockerfile }
    ports: ["3003:3003"]
    depends_on:
      case-backend: { condition: service_healthy }
      guards: { condition: service_healthy }
      gateway: { condition: service_healthy } # 票 27：real adapter 的 LLM 出站经 gateway /proxy/llm/*
      chroma: { condition: service_started } # 票 17：KB 检索面（镜像无健康检查，见上）
      openfga: { condition: service_started } # 票 18：chat 意图闸三态裁决的真 FGA 容器（票 12）
    environment:
      # 票 27（ADR 0002 框架红线）：生产装配默认 real adapter——真 LLM 经 gateway 凭证代理
      # 出站，真凭证只活在网关进程（SECRETS_* 挂 gateway 不挂 agent）；本机离线开发显式
      # AGENT_LLM=fake 切回伪 LLM。上游病了 → worker 降级 uncertain + 人工（fail-closed）。
      AGENT_LLM: ${AGENT_LLM:-real}
      # 验票/会话 HMAC 钥（与 gateway 同一枚，经 .env 注入；缺省 fail-closed 拒登录）
      SOC_HMAC_KEY: ${SOC_HMAC_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-minimax-m2} # PRD 决策 #7
      SOC_LLM_PROXY_URL: ${SOC_LLM_PROXY_URL:-http://gateway:8002/proxy/llm}
      # 票 17：KB 检索面 = 真 chroma 容器（分诊 kb_check 经 ChromaKb 查 approved 条目，
      # 沉淀 kb_write 经 ApprovalToken 正门写入）。未设时回退内存种子/内存面（本机离线开发）。
      KB_CHROMA_URL: ${KB_CHROMA_URL:-http://chroma:8000}
      # 检索 embedding：hash=确定性本地 TF 哈希（离线零依赖，默认）；chroma_default=
      # 服务端默认模型（语义向量，首次写入容器需出网下载 ~80MB，见 chroma 服务注释）
      KB_EMBEDDING: ${KB_EMBEDDING:-hash}
      # 票 18：chat 意图闸的 OpenFGA 出站（容器网络内服务名:原生端口；fga_ids.json 是
      # setup-openfga.sh 每次重建世界时刷新的运行时产物，bind mount 只读共享，不写死）
      FGA_API_URL: ${FGA_API_URL:-http://openfga:8080}
      FGA_IDS_FILE: ${FGA_IDS_FILE:-/fga/fga_ids.json}
      FGA_MATRIX_FILE: ${FGA_MATRIX_FILE:-/fga-matrix/matrix.json}
      # 票 37（ADR 0001）：Langfuse 可选旁路（profile observability）——key 双空 = 旁路
      # 不启用（零开销，默认链路零改动）；.env 配上 key + 开 profile 才镜像 trace
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://langfuse:3000}
      # 票 40（G2-9 清偿）：事件驱动自动拉起——agent 后台轮询 M2 outbox
      # （GET /api/v1/events?after 游标），alert.created → alert_flow、
      # case.closed → knowledge_flow（PRD 消息旅程 step4/step11 的自动化）。
      # 缺省 on；EVENT_DRIVEN=off 可关（手动 POST /internal/runs 与 evals 不受影响）。
      EVENT_DRIVEN: ${EVENT_DRIVEN:-on}
    volumes:
      - "./services/gateway/plugins:/fga:ro" # store/model id 与 contextforge 插件同源一份
      - "./services/gateway/fga:/fga-matrix:ro" # matrix.json = 可见工具清单的单一来源
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3003/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12

  guards:
    build: ./services/guards
    ports: ["8001:8001"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8001/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 12

  gateway:
    build: ./services/gateway
    ports: ["8002:8002"]
    # S1 凭证真值仓（PRD §13 SECRETS_*）：教学假值当金丝雀，真部署改由部署环境注入，
    # 不许把真密钥写进仓库；SOC_HMAC_KEY 不设默认值（票 06 口径：缺它铸票 fail-closed），
    # 部署时同口径以环境变量注入
    environment:
      SOC_LLM_UPSTREAM: ${SOC_LLM_UPSTREAM:-https://api.minimaxi.com}
      # HMAC 钥（铸票/会话签名，与 agent 共享同一枚）经 .env / 部署环境注入；
      # 不给默认值——缺它铸票 fail-closed（票 06 口径，INV-1）
      SOC_HMAC_KEY: ${SOC_HMAC_KEY:-}
      SECRETS_LLM_API_KEY: ${SECRETS_LLM_API_KEY:-}
      SECRETS_VT_KEY: ${SECRETS_VT_KEY:-canary-vt-key-teaching-fake}
      SECRETS_SIEM_TOKEN: ${SECRETS_SIEM_TOKEN:-canary-siem-token-teaching-fake}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8002/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 12

  chroma:
    # 票 17（ADR 0002 框架红线：真 chromadb 落 compose）：官方镜像按 digest 钉（票 26
    # 先例——latest 漂移不可接受；本 digest 实测 = chroma 1.0.0，arm64 本地已验，
    # REST /api/v2/*）。服务端默认 embedding 首次写入会运行时下载 onnx 模型，与离线
    # 纪律冲突 → agent 侧默认显式带 hashEmbedding 出站（vector-store.ts 文件头），
    # KB_EMBEDDING=chroma_default 可切服务端模型，容器才需要出网。
    image: chromadb/chroma@sha256:1e0b73a187a28757c572acba508c46f48c9e8b0acaf5c20e6d95cdedce1acdf6
    # 宿主侧 18000：8000 是高频占用口（本机开发机实测有 python 进程盘踞 127.0.0.1:8000，
    # openfga 给 8080 换 18080 同款处理）；容器网络内仍是 8000，服务间走 http://chroma:8000
    ports: ["18000:8000"]
    volumes: ["./data/chroma:/data"]
    # 官方镜像里没有 wget/curl/python，做不了容器内健康检查；宿主机 curl /api/v2/heartbeat 验证

  # ── 票 12：gateway 三容器并排（modules.md §2·2026-09-04 拍板）────────────
  # openfga（FGA 裁决）+ contextforge（RBAC/渠道面）+ 上面的 gateway 自写件
  # （铸币/凭证代理）。官方镜像一律不重建不 patch，自写件以挂载/env/旁路接入。
  openfga:
    # 内存存储（run 子命令）：容器一停授权世界全没，scripts/setup-openfga.sh
    # 幂等重建 30 秒恢复——教学口径，与 ADR 0001 参考工程一致
    image: openfga/openfga:v1.19.0
    command: ["run"]
    # 宿主侧用 18080：8080 是高频占用口（本机就有 http.server 盘踞），容器网络内仍是 8080
    ports: ["18080:8080"]
    # 镜像是最小件没有 shell/curl：容器内做不了健康检查，setup 脚本在宿主机等 /healthz

  contextforge:
    # 票 26（2026-09-09 切换）：官方镜像按 digest 钉。对应 IBM/mcp-context-forge
    # revision 13d5493714861a2d0edb9c6a9702bce106f65711，镜像内 mcpgateway 1.0.10 + cpex 0.1.3。
    # 新仓 ghcr.io/ibm/mcp-contextforge-gateway 匿名渠道关闭（token 端点 DENIED、manifest 403）；
    # 本机 docker pull 对 ghcr 全程卡死，镜像经 registry API 手工落地——多 arch index
    # 为 sha256:31cf1d45ab56d83fc109ac0de1ada7b359df2497a52765af73421f013fa76b4d，
    # 但 daemon 只认下面这个 arm64 子 manifest digest（见票 26 实现记录与回退路径
    # contextforge.Dockerfile）。插件/授权 ids 全走挂载——升级镜像不碰自写代码。
    image: ghcr.io/ibm/mcp-context-forge@sha256:98dfab27a38b8aa1c1d3bc02c1e911d5a3dfc230559fea22ccdffad2cfd58b6a
    ports: ["4444:4444"]
    environment:
      PLUGINS_ENABLED: "true"
      # 1.0.x 启动即校验密钥（占位符拒绝启动，fail-closed）；教学假值对位 gateway 的
      # SECRETS_* 金丝雀口径：绝不放真密钥，真部署由环境注入
      JWT_SECRET_KEY: "teaching-jwt-secret-do-not-use-in-prod"
      AUTH_ENCRYPTION_SECRET: "teaching-auth-encryption-secret-do-not-use-in-prod"
      # 1.0.10 新增三件（票 26 实测）：gunicorn 绑定面默认 127.0.0.1（不放开则宿主端口
      # 映射不通）+ 平台管理员/默认用户密码强校验（≥12 位，email_auth_enabled 默认开）
      HOST: "0.0.0.0"
      PLATFORM_ADMIN_PASSWORD: "teaching-admin-pass-do-not-use-in-prod"
      DEFAULT_USER_PASSWORD: "teaching-user-pass-do-not-use-in-prod"
    volumes: ["./services/gateway/plugins:/app/plugins"]
    depends_on:
      openfga: { condition: service_started }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:4444/health')"]
      interval: 5s
      timeout: 3s
      retries: 24


  web:
    build: { context: ., dockerfile: services/web/Dockerfile }
    ports: ["5173:5173"]
    # 票 20：vite dev 代理的上游（vite.config.ts 读这三个 env；本机开发缺省 127.0.0.1）
    environment:
      AGENT_URL: http://agent:3003
      M2_URL: http://case-backend:3002
      INGEST_URL: http://ingest:3001
    depends_on:
      ingest: { condition: service_healthy } # 回放按钮的正门（FR-M10.1）
      case-backend: { condition: service_healthy } # 告警/审计查询（FR-M10.1/.5）
      gateway: { condition: service_healthy }
      agent: { condition: service_healthy } # 登录/流水线 SSE（FR-M10.2）
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5173/"]
      interval: 5s
      timeout: 3s
      retries: 12

  # ── 票 37（ADR 0001 承诺兑现）：Langfuse 可选观测 profile ─────────────────
  # 默认一键启动不含这两个服务（九服务拓扑不变，验收②），`docker compose --profile
  # observability up -d` 才起。v2 单镜像 + postgres（v3 依赖栈 postgres+clickhouse+
  # valkey+minio 违反「一键可起」水位线——PRD v1.1 变更 1 原文口径）。官方镜像按
  # index digest 钉（= v2.95.11 / postgres 17-alpine，2026-09-09 arm64 本地实测）。
  # 票 26 出入备案：[26-1] 常设口径钉 arm64 子 manifest，是 ghcr+containerd store 的
  # 实证限制；Docker Hub 的 index digest 本机 daemon 实证可 pull 且 CI amd64 同用一枚
  # （子 manifest 跨 arch 反而拉不动），故此处钉 index，升级跟踪照 [26-2] 以 index
  # digest 前进为准。
  langfuse:
    image: langfuse/langfuse@sha256:85c278dcab96c15db94191a5c1664f85aba2d7fb6771a00e99681c902c4b7015
    profiles: ["observability"]
    # 宿主侧 13000：3000 是高频占用口（React/Next dev 默认口），同 openfga 18080 处理；
    # 容器网络内仍是 3000，agent 侧默认 LANGFUSE_HOST=http://langfuse:3000
    ports: ["13000:3000"]
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://localhost:13000
      # 教学假值当金丝雀（contextforge JWT_SECRET_KEY 同口径）：可跑通全链路，真部署
      # 由部署环境注入，绝不放真密钥进仓库。ENCRYPTION_KEY 必须长期固定——换了它，
      # 数据卷里已存的项目 API key 解不开（-langfuse 起不来）
      NEXTAUTH_SECRET: "teaching-nextauth-secret-do-not-use-in-prod"
      SALT: "teaching-salt-do-not-use-in-prod"
      ENCRYPTION_KEY: "4ca0c2593e5012947049e369f6ba86f620a1a8ce4b245b409eb21ab07572fb46"
      TELEMETRY_ENABLED: "false" # 离线纪律：遥测不出网
      # 首启自动种组织/项目/用户 + 固定 API key（教学假 key，与 .env.example/冒烟脚本同串）：
      # 免手点 UI 建 key，agent 侧旁路与 trace 查询开箱即用
      LANGFUSE_INIT_ORG_ID: "local-demo"
      LANGFUSE_INIT_ORG_NAME: "local-demo"
      LANGFUSE_INIT_PROJECT_ID: "local-demo"
      LANGFUSE_INIT_PROJECT_NAME: "local-demo"
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: "pk-lf-local-demo"
      LANGFUSE_INIT_PROJECT_SECRET_KEY: "sk-lf-local-demo"
      LANGFUSE_INIT_USER_EMAIL: "demo@soc-demo.local"
      LANGFUSE_INIT_USER_NAME: "demo"
      LANGFUSE_INIT_USER_PASSWORD: "teaching-demo-pass-not-for-prod"
    depends_on:
      langfuse-db: { condition: service_healthy }
    healthcheck:
      # 官方镜像没有 wget/curl（debian slim + node），用镜像自带的 node 发探活
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/public/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s # 首启要跑 DB 迁移，慢是正常的

  langfuse-db:
    # postgres:17-alpine（官方 v2 compose 同款大版本）按 index digest 钉，口径见上
    image: postgres@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    profiles: ["observability"]
    # 不映射宿主端口：只有 langfuse 容器内网要用（少占一个宿主口；排障 docker exec 进去）
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse # 教学假值：端口不出宿主机，数据卷不外流
      POSTGRES_DB: langfuse
    volumes: ["./data/langfuse-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 5s
      timeout: 3s
      retries: 12

  # ── 票 38（PRD FR-M1.6 / 决策 #4）：Wazuh 真实模式 profile ─────────────────
  # 默认一键启动不含它（九服务拓扑不变），`docker compose --profile real-wazuh up -d
  # wazuh-manager` 才起（点名服务，不碰默认栈）。只要 manager 单容器当「真规则引擎」
  # backdrop（logtest 喂数用），不要 indexer/dashboard 全家桶——PRD 只要 logtest，
  # 水位线纪律同票 37（compose-topology.test.ts 有机器断言）。
  wazuh-manager:
    # 官方单容器镜像按 index digest 钉（票 37 口径：Docker Hub index digest 本机 daemon
    # 实证可 pull，CI amd64 同用一枚）= wazuh/wazuh-manager 4.14.7（2026-09-01 发布，
    # 多 arch；2026-09-09 arm64 本地实测）。喂数脚本 scripts/wazuh-logtest-feed.ts。
    image: wazuh/wazuh-manager@sha256:80cada6a192fcb8caa8b415a5b64e2155138dd8df1da3a7b227d7e5e4e7460c0
    profiles: ["real-wazuh"]
    # 只露 API 口：宿主侧 15500（55000 落在 macOS/Linux 临时端口段 49152+/32768+ 里，
    # 偶发被随机连接占用，同 langfuse 13000 口径）；容器内仍是 55000。API 是 https +
    # 自签证书（PRD FR-M1.6 的 PUT /logtest 在这口）。agent 接入口 1514/1515/514 不开——
    # 本地不收 agent，只要 logtest。
    ports: ["15500:55000"]
    environment:
      # 官方镜像的 API 账号注入口（Docker Hub 文档口径，默认即这两串）。教学假值当
      # 金丝雀（contextforge JWT_SECRET_KEY 同口径）：wazuh-logtest-feed.ts 的默认值
      # 与这里同串；真部署由部署环境注入，绝不放真密钥进仓库。
      API_USERNAME: wazuh-wui
      API_PASSWORD: "MyS3cr37P450r.*-"
    # 官方 compose 同款文件句柄上限（manager 内部 ossec-analysisd 打开规则/解码器文件多）
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # 定制 ossec.conf（deploy/wazuh-manager/，源=官方镜像原版仅关两段）：漏洞检测
    # enabled=no（否则每次启动自动下全量 CVE 库 5-8GB，曾撑爆容器层+宿主磁盘）；
    # indexer 连接器 enabled=no。实测（4.14.7）：VD 彻底不下载；连接器受 s6 已知
    # 行为影响仍会起（wazuh/wazuh#35264），但有界：LMDB 约 110MB 见顶不再涨。
    # 只读挂载到官方路径；无状态口径不变——不挂任何数据卷，重跑 up 幂等
    volumes:
      - "./deploy/wazuh-manager/ossec.conf:/var/ossec/etc/ossec.conf:ro"
