<h1>microsandbox —— 第四攻击面</h1>
<p><b>干什么：</b>M6 富化的 analyzer 按 Cortex 真实架构是可执行脚本，每次在一次性 microVM 里真跑。</p><ul><li><b>攻击面是刻意布置的教学场景</b>：投毒/被污染的 analyzer 企图外联 C2 或读宿主凭证 → 沙箱拦截 + 审计</li><li>路线 2 的逃逸/egress/密钥不可见攻击验收迁移至此</li><li>不是常驻服务，按需拉起一次性 VM</li></ul>
