<p><b>干什么：</b>存知识沉淀条目（FP 模式/处置 runbook），分诊和调查时检索注入提速。</p><ul><li><b>硬闸</b>：agent 提炼的草稿必须人审通过才进检索面——RAG 投毒的第一道防线</li><li>检索进 prompt 的内容同样打不可信标记（知识对 LLM 是数据不是指令）</li><li>验收：毒 runbook 被驳回后，检索面确定性查不到</li></ul>
