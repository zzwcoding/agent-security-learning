<h1>C4 防护微服务 —— 文本防线</h1>
<p><b>干什么：</b>llm-guard 注入扫描（告警字段/用户输入/KB 内容/工具输出四通道）+ Presidio PII 脱敏（出域前，内网 IP 豁免）。</p><ul><li><b>fail-closed</b>：扫描服务挂了 = 不可信内容不进 prompt，转人工</li><li>文本防线只是第一层；就算穿透，越权动作还会被验票闸行为兜底（纵深两层）</li><li>复用路线 1-3 管线</li></ul>
