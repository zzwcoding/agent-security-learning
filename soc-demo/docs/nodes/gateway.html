<h1>C5 网关三容器 —— 身份与铸币</h1>
<p><b>干什么：</b>ContextForge（RBAC 工具可见性：什么角色看得见什么工具）+ OpenFGA（FGA 裁决：这个身份能不能用）+ 自写小服务（铸任务票/审批票 + 凭证代理）。</p><ul><li><b>拆件复用</b>：proxy.py / task_token.py 票型 / fga_check 插件来自路线 3 实测代码（ADR 0001）</li><li><b>凭证代理</b>：LLM 上下文里只有占位符，真 key 在这里注入，全链路金丝雀断言防泄露</li><li>汇报金句：LLM 不能给自己授权、不能批准自己、不能解析凭证</li></ul>
