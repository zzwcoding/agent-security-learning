<h1>M10 Web 演示窗 —— 薄客户端</h1>
<p><b>干什么：</b>六个页面：告警列表 / 流水线实时视图 / 审批卡 / 案件时间线 / 审计流 / Eval 结果。</p><ul><li><b>零特权</b>：所有数据走公开 REST + SSE，没有任何 Web 专属后门接口——curl 能演全剧本</li><li><b>告警列表页有回放按钮</b>：演示布景入口（背后是 replay 脚本）</li><li>SSE 断线自动重连 + Last-Event-ID 补发</li></ul>
