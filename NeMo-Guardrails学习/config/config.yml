# NeMo Guardrails 配置:本阶段再加一道闸机 —— output rail(出口安检)
models:
  - type: main           # 主 LLM,一个配置里必须有一个 type: main
    engine: openai       # 走 OpenAI 兼容协议
    model: MiniMax-M2
    parameters:
      base_url: https://api.minimaxi.com/v1  # 长期备忘:0.23 起必须写这,不认 OPENAI_BASE_URL 环境变量

rails:
  input:
    flows:
      - self check input   # 入口闸:用户消息先安检,被拦直接拒答,主回复流程不启动
  output:
    flows:
      - self check output  # 出口闸:LLM 写好的回复在交给用户前再检一次,被拦则换成固定拒答
# api key 由 scripts/run-with-keychain.sh 注入 OPENAI_API_KEY
